<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F7DF6B"/>
      <stop offset="1" stop-color="#E6C135"/>
    </linearGradient>
    <linearGradient id="maroon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6b1717"/>
      <stop offset="1" stop-color="#3d0f0f"/>
    </linearGradient>
  </defs>

  <!-- Maroon rounded background -->
  <rect width="512" height="512" rx="112" fill="url(#maroon)"/>

  <!-- Gold ring -->
  <circle cx="256" cy="256" r="176" fill="none" stroke="#C99A2E" stroke-opacity="0.45" stroke-width="10"/>
  <!-- Gold disc -->
  <circle cx="256" cy="256" r="150" fill="url(#gold)"/>

  <!-- Alcho "A" mark -->
  <text x="256" y="350" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="260" font-weight="bold" fill="#581212">A</text>
</svg>
