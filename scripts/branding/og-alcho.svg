<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#3d0f0f"/>
      <stop offset="0.55" stop-color="#220a06"/>
      <stop offset="1" stop-color="#140a05"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F7DF6B"/>
      <stop offset="1" stop-color="#E6C135"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#C99A2E" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#C99A2E" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="600" cy="120" r="380" fill="url(#glow)"/>
  <circle cx="1050" cy="560" r="240" fill="url(#glow)" opacity="0.5"/>

  <!-- Inset gold frame -->
  <rect x="36" y="36" width="1128" height="558" rx="28" fill="none" stroke="#C99A2E" stroke-opacity="0.35" stroke-width="2"/>

  <!-- Kicker -->
  <text x="600" y="150" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="26" font-weight="bold" letter-spacing="10" fill="#E6C135">INDUSTRIAL FLAVOR SOLUTIONS</text>

  <!-- Logo: gold pill + Alcho wordmark -->
  <g>
    <path d="M250 300C250 300 300 232 400 222H800C900 232 950 300 950 300C950 300 900 368 800 378H400C300 368 250 300 250 300Z" fill="url(#gold)"/>
    <text x="600" y="332" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="120" font-weight="bold" fill="#581212">Alcho</text>
  </g>

  <!-- Tagline -->
  <text x="600" y="470" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="40" fill="#F6EFE0">“Every Great Dish Starts With Great Seasoning”</text>

  <!-- Domain -->
  <text x="600" y="540" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="22" letter-spacing="6" fill="#C99A2E">WWW.ALCHO.MY.ID</text>
</svg>
